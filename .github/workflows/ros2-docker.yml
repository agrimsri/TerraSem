name: ROS 2 Docker CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ROS 2 Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.ros2
          push: false
          tags: terrasem:latest
